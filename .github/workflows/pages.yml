name: Build and deploy site

# The site is static: index.html plus the exported JSON under web/data/. The
# crawl database is deliberately not in git, so this workflow does not re-run
# the crawler — it proves the committed data is consistent and then publishes
# it. Re-generating the data is a local (or scheduled, DB-backed) job.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "closed.json"
      - "scripts/validate_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Demo smoke test
        run: node tests/demo_smoke.js .

      - name: Validate exported data
        run: python scripts/validate_site.py web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
