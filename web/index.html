<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eater 38 — list history</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e4; --now:#1a7f37; --past:#8a6d3b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); }
  header { padding:18px 24px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted); font-size:12.5px; margin-top:6px; }
  .layout { display:grid; grid-template-columns: minmax(280px,380px) 1fr; height:calc(100vh - 104px); }
  .panel { overflow:auto; border-right:1px solid var(--line); padding:16px 18px; }
  #map { height:100%; }
  nav { display:flex; gap:6px; margin:12px 0; flex-wrap:wrap; }
  nav button { font:inherit; padding:5px 11px; border:1px solid var(--line); background:#fff; border-radius:999px; cursor:pointer; }
  nav button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=search] { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; }

  /* double-ended date range slider */
  .range-wrap { border:1px solid var(--line); border-radius:9px; padding:10px 12px 7px; margin-bottom:12px; }
  .range-head { display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; }
  .range-head .lbl { color:var(--muted); font-weight:400; font-size:11px; text-transform:uppercase; letter-spacing:.04em; display:block; }
  .range { position:relative; height:30px; margin:2px 0 0; }
  .range-track, .range-fill { position:absolute; top:13px; height:4px; border-radius:2px; pointer-events:none; }
  .range-track { left:0; right:0; background:var(--line); }
  .range-fill { background:var(--now); }
  .range input[type=range] { position:absolute; top:0; left:0; width:100%; height:30px; margin:0;
    -webkit-appearance:none; appearance:none; background:none; pointer-events:none; }
  .range input[type=range]::-webkit-slider-runnable-track { background:none; height:30px; }
  .range input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:16px; height:16px;
    margin-top:7px; border-radius:50%; background:#fff; border:2px solid var(--now); cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .range input[type=range]::-moz-range-track { background:none; height:30px; }
  .range input[type=range]::-moz-range-thumb { pointer-events:auto; width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--now); cursor:pointer; }
  .range-note { color:var(--muted); font-size:12px; margin-top:3px; }

  .row { padding:9px 8px; border-bottom:1px solid var(--line); border-radius:6px; transition:background .08s; cursor:pointer; }
  .row.hot { background:#fff4e6; }
  .row.unmapped { cursor:default; }
  .row .name { font-weight:600; }
  .row .meta { color:var(--muted); font-size:12.5px; }
  .row .meta.span { color:#256029; }
  .row .site { font-size:12.5px; }
  .row .site a { color:#0b62c4; text-decoration:none; }
  .row .site a:hover { text-decoration:underline; }
  .chip { display:inline-block; font-size:11.5px; padding:1px 7px; border-radius:999px; background:#eef2ee; color:#256029; margin-left:6px; }
  .nopin { font-size:11px; color:#9a9a9a; margin-left:6px; }
  footer { padding:9px 24px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  .leaflet-tooltip.e38 { font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    white-space:normal; max-width:min(520px,78vw); padding:10px 13px; }
  .leaflet-tooltip.e38 b { font-size:13.5px; }
  .leaflet-tooltip.e38 .k { color:var(--muted); font-size:12px; }
  .leaflet-tooltip.e38 .blurb { margin:6px 0 6px; line-height:1.5; }
  /* One shadow for the entire pin layer. A filter per path would mean 244
     compositing layers; this is a single one. */
  .leaflet-overlay-pane svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .leaflet-tooltip.e38 { border:0; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .legend { background:#fff; padding:8px 10px; border-radius:7px; box-shadow:0 1px 5px rgba(0,0,0,.25);
            font:12.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .legend b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:3px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .legend .count { color:var(--muted); margin-top:4px; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; height:auto; } #map { height:340px; } .panel { border-right:0; } }
</style>
</head>
<body>
<header>
  <h1>Eater NY “38 Best Restaurants” — list history</h1>
  <div class="sub" id="meta">loading…</div>
  <div class="hint" id="hint"></div>
</header>

<div class="layout">
  <div class="panel">
    <nav>
      <button data-view="current" aria-selected="true">Current list</button>
      <button data-view="range">Date range</button>
      <button data-view="all">All 245</button>
    </nav>

    <div class="range-wrap" id="rangeWrap" hidden>
      <div class="range-head">
        <span><span class="lbl">From</span><span id="rangeFrom">—</span></span>
        <span style="text-align:right"><span class="lbl">To</span><span id="rangeTo">—</span></span>
      </div>
      <div class="range">
        <div class="range-track"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" id="rangeA" min="0" max="1" value="0" step="1" aria-label="Start of range">
        <input type="range" id="rangeB" min="0" max="1" value="1" step="1" aria-label="End of range">
      </div>
      <div class="range-note" id="rangeNote"></div>
    </div>

    <div id="searchWrap"><input type="search" id="search" placeholder="Filter by name or address…"></div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<footer>
  Data: Wayback Machine captures of ny.eater.com/maps/best-new-york-restaurants-38-map.
  Serve this folder over HTTP (e.g. <code>python -m http.server</code>) so the JSON can load.
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Saturated fills with a white casing so pins read against busy OSM tiles,
// where a muted green sits too close to parkland and brown to buildings.
const NOW = '#00c853', PAST = '#ff6d00';
const BASE = { radius: 7, weight: 2.5, color: '#ffffff', fillOpacity: 1 };
const HOT  = { radius: 12, weight: 3.5, color: '#111111', fillOpacity: 1 };
const DAY = 86400000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const state = { places: [], byId: new Map(), current: null, view: 'current', q: '',
                firstDate: null, lastDate: null, from: null, to: null };
const markers = new Map();      // place id -> circleMarker layer

/* ---- date maths (UTC, day granularity) -------------------------------- */
const toUTC = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const isoAt = i => new Date(toUTC(state.firstDate) + i * DAY).toISOString().slice(0, 10);
const indexOf = iso => Math.round((toUTC(iso) - toUTC(state.firstDate)) / DAY);
const daySpan = () => indexOf(state.lastDate);

/* ---- map -------------------------------------------------------------- */
const map = L.map('map', { scrollWheelZoom: true }).setView([40.73, -73.97], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); legend._div = d; return d; };
legend.addTo(map);

function updateLegend(title, rows, count) {
  legend._div.innerHTML = `<b>${esc(title)}</b>` +
    rows.map(([color, label]) => `<div><i style="background:${color}"></i>${esc(label)}</div>`).join('') +
    (count === null ? '' : `<div class="count">${count} pin${count === 1 ? '' : 's'}</div>`);
}

const isMapped = p => p && p.lat !== null && p.lat !== undefined && p.lng !== null && p.lng !== undefined;
const defaultColor = id => (state.byId.get(id)?.on_list_now ? NOW : PAST);

function paint(ids) {
  const want = new Set(ids);
  markers.forEach((layer, id) => {
    if (want.has(id)) {
      layer.setStyle(Object.assign({}, BASE, { fillColor: defaultColor(id) }));
      if (!map.hasLayer(layer)) layer.addTo(map);
    } else if (map.hasLayer(layer)) {
      layer.closeTooltip();
      map.removeLayer(layer);
    }
  });
}

function fitTo(ids) {
  const pts = ids.map(id => markers.get(id)).filter(l => l && map.hasLayer(l));
  if (pts.length) map.fitBounds(L.featureGroup(pts).getBounds(), { padding: [40, 40], maxZoom: 14 });
}

/* ---- tooltips / click-through ---------------------------------------- */
function tooltipHtml(place) {
  const spells = place.periods.map(p =>
    `${p.from_date} → ${p.to_date}${p.still_on ? ' <span class="k">(still on)</span>' : ''}`).join('<br>');
  const facts = [place.open_for, place.price].filter(Boolean).join(' · ');
  const site = place.website
    ? esc(place.website.replace(/^https?:\/\//, '').replace(/\/$/, ''))
    : 'no website on file';
  return `<b>${esc(place.name)}</b>`
    + (place.address ? `<div class="k">${esc(place.address)}</div>` : '')
    + (place.blurb ? `<div class="blurb">${esc(place.blurb)}</div>` : '')
    + (facts ? `<div class="k">${esc(facts)}</div>` : '')
    + `<div class="k">${spells}</div>`
    + `<div class="k">${site}</div>`;
}

const layer = L.geoJSON(null, {
  pointToLayer: (f, latlng) => L.circleMarker(latlng, Object.assign(
    { className: 'e38-pin' }, BASE, {
      fillColor: f.properties.on_list_now ? NOW : PAST
    })),
  onEachFeature: (f, l) => {
    const place = state.byId.get(f.properties.id);
    if (!place) return;
    markers.set(place.id, l);
    l.bindTooltip(tooltipHtml(place), { className: 'e38', direction: 'top',
                                       offset: [0, -8], opacity: 1 });
    l.on('mouseover', () => l.openTooltip());
    l.on('mouseout', () => l.closeTooltip());
    l.on('click', () => openSite(place));
  }
});   // not added here: applyView() decides which pins are visible

function openSite(place) {
  const url = place.website || place.eater_url;
  if (url) window.open(url, '_blank', 'noopener');
}

const FOCUS_ZOOM = 16;

/** Centre the map on a place and zoom in to street level. */
function focusPlace(id) {
  const place = state.byId.get(id);
  const m = markers.get(id);
  if (!place || !m || !isMapped(place) || !map.hasLayer(m)) return false;
  m.bringToFront();
  m.openTooltip();
  map.flyTo([place.lat, place.lng], Math.max(map.getZoom(), FOCUS_ZOOM), { duration: 0.7 });
  return true;
}

/** Keep a wide tooltip inside the map instead of letting it clip at an edge. */
map.on('tooltipopen', e => {
  const el = e.tooltip.getElement();
  if (!el) return;
  const frame = map.getContainer().getBoundingClientRect();
  const box = el.getBoundingClientRect();
  const pad = 6;
  let dx = 0;
  if (box.left < frame.left + pad) dx = frame.left + pad - box.left;
  else if (box.right > frame.right - pad) dx = frame.right - pad - box.right;
  if (dx) L.DomUtil.setPosition(el, L.DomUtil.getPosition(el).add([dx, 0]));
});

function highlight(id, on) {
  const m = markers.get(id);
  if (!m || !map.hasLayer(m)) return;
  m.setStyle(on ? HOT : Object.assign({}, BASE, { fillColor: defaultColor(id) }));
  if (on) { m.bringToFront(); m.openTooltip(); } else { m.closeTooltip(); }
}

/* ---- which places are in play ---------------------------------------- */
const inWindow = p => (p.periods || []).some(x =>
  x.from_date <= state.to && x.to_date >= state.from);

function currentRows() {
  return (state.current?.entries || []).map(e => {
    const place = state.byId.get(e.place_id);
    return place ? { ...place, name: e.name, position: e.position } : null;
  }).filter(Boolean);
}

/** Places for the active tab, before the search box is applied. */
function visiblePlaces() {
  if (state.view === 'current') return currentRows();
  if (state.view === 'range') {
    return state.places.filter(inWindow).sort((a, b) => a.name.localeCompare(b.name));
  }
  return [...state.places].sort((a, b) => a.name.localeCompare(b.name));
}

function searched(rows) {
  if (!state.q) return rows;
  const q = state.q.toLowerCase();
  return rows.filter(r => (r.name + ' ' + (r.address || '')).toLowerCase().includes(q));
}

/* ---- panel ------------------------------------------------------------ */
const fmtPeriod = p => `${p.from_date} → ${p.to_date}${p.still_on ? ' (still on)' : ''}`;
const periodsText = p => p.periods.map(fmtPeriod).join(' · ');

function rowHtml(r, numbered) {
  const mapped = isMapped(r);
  const site = r.website || r.eater_url;
  const hit = state.view === 'range' && inWindow(r);
  return `
  <div class="row${mapped ? '' : ' unmapped'}" data-place="${esc(r.id)}"
       ${mapped ? '' : 'title="No coordinates in the source data for this restaurant"'}>
    <div class="name">${numbered ? r.position + '. ' : ''}${esc(r.name)}
      ${r.on_list_now && !numbered ? '<span class="chip">on list</span>' : ''}
      ${mapped ? '' : '<span class="nopin">no pin</span>'}</div>
    <div class="meta${hit ? ' span' : ''}">${esc(periodsText(r))}</div>
    ${r.address ? `<div class="meta">${esc(r.address)}</div>` : ''}
    ${site ? `<div class="site"><a href="${esc(site)}" target="_blank" rel="noopener"
       title="${r.website ? 'Restaurant website' : 'Eater entry (no restaurant website on file)'}"
       >${r.website ? esc(r.website.replace(/^https?:\/\//, '').replace(/\/$/, '')) : 'Eater entry ↗'}</a></div>` : ''}
  </div>`;
}

function render() {
  const rows = searched(visiblePlaces());
  $('#list').innerHTML = rows.map(r => rowHtml(r, state.view === 'current')).join('')
    || '<p class="meta">No matches.</p>';
}

function applyView(refit) {
  const rows = searched(visiblePlaces());
  const ids = rows.map(r => r.id).filter(id => markers.has(id));
  paint(ids);
  if (state.view === 'current') {
    updateLegend('Current list', [[NOW, 'on the list today']], ids.length);
  } else if (state.view === 'range') {
    updateLegend(`${state.from} → ${state.to}`,
                 [[NOW, 'on the list today'], [PAST, 'rotated out']], ids.length);
  } else {
    updateLegend('All restaurants', [[NOW, 'on the list today'], [PAST, 'rotated out']], ids.length);
  }
  if (refit !== false) fitTo(ids);
  $('#hint').textContent = state.view === 'current'
    ? 'Hover an entry to spotlight its pin · click it to zoom in · click a pin to open the restaurant’s website.'
    : state.view === 'range'
      ? 'Drag either end of the range to see who was on the list then · click an entry to zoom in.'
      : 'Every restaurant that was ever on the list, including those rotated out · click an entry to zoom in.';
}

/* ---- range slider ----------------------------------------------------- */
const rangeA = $('#rangeA'), rangeB = $('#rangeB');

function paintSlider() {
  const span = daySpan() || 1;
  const a = indexOf(state.from), b = indexOf(state.to);
  $('#rangeFill').style.left = (a / span * 100) + '%';
  $('#rangeFill').style.width = ((b - a) / span * 100) + '%';
  $('#rangeFrom').textContent = state.from;
  $('#rangeTo').textContent = state.to;
  rangeA.value = a;
  rangeB.value = b;
}

function onSliderChange() {
  let a = Number(rangeA.value), b = Number(rangeB.value);
  if (a > b) {                        // the thumb that moved pushes the other
    if (document.activeElement === rangeA) b = a; else a = b;
    rangeA.value = a; rangeB.value = b;
  }
  state.from = isoAt(a);
  state.to = isoAt(b);
  paintSlider();
  render();
  applyView(false);                   // don't yank the map around while dragging
}

function initSlider() {
  rangeA.min = rangeB.min = 0;
  rangeA.max = rangeB.max = daySpan();
  rangeA.value = indexOf(state.from);
  rangeB.value = indexOf(state.to);
  paintSlider();
  rangeA.addEventListener('input', onSliderChange);
  rangeB.addEventListener('input', onSliderChange);
  $('#rangeNote').textContent =
    `Anything on the list between these dates. Full archive: ${state.firstDate} → ${state.lastDate}.`;
}

/* ---- events ----------------------------------------------------------- */
$('#list').addEventListener('mouseover', e => {
  const row = e.target.closest('.row');
  if (!row || !row.dataset.place) return;
  row.classList.add('hot');
  highlight(row.dataset.place, true);
});
$('#list').addEventListener('mouseout', e => {
  const row = e.target.closest('.row');
  if (!row || !row.dataset.place) return;
  if (e.relatedTarget && row.contains(e.relatedTarget)) return;
  row.classList.remove('hot');
  highlight(row.dataset.place, false);
});

$('#list').addEventListener('click', e => {
  if (e.target.closest('a')) return;        // the inline website link keeps its own job
  const row = e.target.closest('.row');
  if (!row || !row.dataset.place) return;
  focusPlace(row.dataset.place);
});

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  $('#rangeWrap').hidden = state.view !== 'range';
  render();
  applyView();
}));

$('#search').addEventListener('input', e => {
  state.q = e.target.value;
  render();
  applyView();
});

/* ---- boot ------------------------------------------------------------- */
const load = name => fetch(`data/${name}`, { cache: 'no-store' }).then(r => r.json());
Promise.all([load('places.json'), load('current.json'), load('meta.json'), load('places.geojson')])
  .then(([places, current, meta, geo]) => {
    Object.assign(state, { places, current });
    state.byId = new Map(places.map(p => [p.id, p]));
    state.firstDate = meta.coverage.first_observation;
    state.lastDate = meta.coverage.last_observation;
    state.to = state.lastDate;                              // default window: last year
    state.from = isoAt(Math.max(0, indexOf(state.lastDate) - 365));

    $('#meta').textContent =
      `${meta.counts.places} restaurants · ${meta.counts.stretches} list stints · ` +
      `${meta.counts.changes} recorded changes · ${meta.counts.on_list_now} on the list today · ` +
      `${meta.counts.mapped} with map coordinates · ` +
      `${meta.coverage.captures_indexed} captures indexed (${state.firstDate} → ${state.lastDate})`;

    layer.addData(geo);          // registers every marker; visibility is set by applyView()
    initSlider();
    render();
    applyView();
  })
  .catch(err => { $('#meta').textContent = 'Could not load data: ' + err.message; });
</script>
</body>
</html>
